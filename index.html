<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Embed Calendar & Task</title>
  <!-- Google Fonts: Rozha One & Libre Bodoni -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Rozha+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #191919;
      --card-bg-color: #ffffff;
      --accent-blue: #8fa7cc;
      --gray-color: #868C91;
      --text-black: #000000;
      --text-white: #ffffff;
      --font-number: 'Rozha One', serif;
      --font-text: 'Libre Bodoni', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      padding: 20px;
      max-width: 1100px;
      margin: 0 auto;
      font-family: var(--font-text);
    }

    /* 数字用フォントクラス */
    .num-font {
      font-family: var(--font-number);
    }

    /* テキスト用フォントクラス */
    .text-font {
      font-family: var(--font-text);
    }

    /* ヘッダー・操作エリア */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-btn {
      background-color: transparent;
      border: 1px solid var(--gray-color);
      color: var(--text-white);
      width: 36px;
      height: 36px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    .nav-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    /* 8/30-9/5 のタイトル文字色は白 */
    .current-title {
      font-weight: bold;
      font-size: 1.5rem;
      color: var(--text-white);
      font-family: var(--font-number);
    }

    .view-switch {
      display: flex;
      gap: 8px;
    }

    .switch-btn {
      background: none;
      border: 1px solid var(--gray-color);
      padding: 6px 16px;
      border-radius: 0px;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--text-white);
      font-family: var(--font-text);
    }

    .switch-btn.active {
      background-color: var(--accent-blue);
      color: #ffffff;
      border-color: var(--accent-blue);
    }

    /* カレンダーグリッド */
    .calendar-grid {
      display: grid;
      gap: 12px;
    }

    .calendar-grid.week {
      grid-template-columns: repeat(7, 1fr);
    }

    .calendar-grid.month {
      grid-template-columns: repeat(7, 1fr);
    }

    /* 日付カード（背景白） */
    .day-card {
      background-color: var(--card-bg-color);
      border: 1px solid var(--gray-color);
      border-radius: 0px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .day-header {
      background-color: var(--accent-blue);
      color: #ffffff;
      padding: 8px 6px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      line-height: 1.2;
    }

    .day-header .date-num {
      font-family: var(--font-number);
    }

    .day-header .day-text {
      font-family: var(--font-text);
    }

    .task-area {
      padding: 10px 8px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* タスクリスト */
    .task-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-family: var(--font-text);
    }

    .task-checkbox {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1px solid var(--gray-color);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }

    .task-checkbox:checked {
      background-color: var(--gray-color);
    }

    .task-checkbox:checked::after {
      content: '✓';
      color: #ffffff;
      font-size: 12px;
      position: absolute;
      top: -3px;
      left: 2px;
      font-family: sans-serif;
    }

    .task-text {
      color: var(--text-black);
      word-break: break-all;
      font-family: var(--font-text);
    }

    .task-checkbox:checked + .task-text {
      text-decoration: line-through;
      color: var(--gray-color);
    }

    /* 入力フォーム */
    .add-task-input {
      width: 100%;
      border: none;
      border-bottom: 1px dashed var(--gray-color);
      outline: none;
      font-size: 0.9rem;
      padding: 4px 0;
      margin-top: auto;
      background: transparent;
      color: var(--text-black);
      font-family: var(--font-text);
    }

    .add-task-input::placeholder {
      color: var(--gray-color);
      opacity: 0.8;
      font-family: var(--font-text);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="nav-controls">
      <button class="nav-btn" id="prev-btn">◀</button>
      <button class="nav-btn" id="next-btn">▶</button>
      <span class="current-title" id="current-title"></span>
    </div>
    <div class="view-switch">
      <button class="switch-btn active" id="week-view-btn">W</button>
      <button class="switch-btn" id="month-view-btn">M</button>
    </div>
  </div>

  <div class="calendar-grid week" id="calendar-grid"></div>

  <script>
    let currentDate = new Date();
    let currentView = 'week';
    const daysEn = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

    const tasks = {};

    const gridEl = document.getElementById('calendar-grid');
    const titleEl = document.getElementById('current-title');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const weekViewBtn = document.getElementById('week-view-btn');
    const monthViewBtn = document.getElementById('month-view-btn');

    function formatDateKey(date) {
      return `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate()}`;
    }

    function renderHeaderTitle(dates) {
      if (currentView === 'week') {
        const start = dates[0];
        const end = dates[6];
        titleEl.textContent = `${start.getMonth() + 1}/${start.getDate()} - ${end.getMonth() + 1}/${end.getDate()}`;
      } else {
        titleEl.textContent = `${currentDate.getFullYear()} / ${currentDate.getMonth() + 1}`;
      }
    }

    function getWeekDates(date) {
      const start = new Date(date);
      const day = start.getDay();
      start.setDate(start.getDate() - day);

      const week = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(start);
        d.setDate(d.getDate() + i);
        week.push(d);
      }
      return week;
    }

    function getMonthDates(date) {
      const year = date.getFullYear();
      const month = date.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      const days = [];
      const startDayOfWeek = firstDay.getDay();

      for (let i = startDayOfWeek; i > 0; i--) {
        days.push(new Date(year, month, 1 - i));
      }
      for (let i = 1; i <= lastDay.getDate(); i++) {
        days.push(new Date(year, month, i));
      }
      return days;
    }

    function renderCalendar() {
      gridEl.innerHTML = '';
      gridEl.className = `calendar-grid ${currentView}`;

      const dates = currentView === 'week' ? getWeekDates(currentDate) : getMonthDates(currentDate);
      renderHeaderTitle(dates);

      dates.forEach(date => {
        const dateKey = formatDateKey(date);
        const dayCard = document.createElement('div');
        dayCard.className = 'day-card';

        const header = document.createElement('div');
        header.className = 'day-header';
        header.innerHTML = `<span class="date-num">${date.getMonth() + 1}/${date.getDate()}</span> <span class="day-text">(${daysEn[date.getDay()]})</span>`;

        const taskArea = document.createElement('div');
        taskArea.className = 'task-area';

        if (tasks[dateKey]) {
          tasks[dateKey].forEach((task) => {
            const item = document.createElement('div');
            item.className = 'task-item';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'task-checkbox';
            checkbox.checked = task.completed;
            checkbox.addEventListener('change', () => {
              task.completed = checkbox.checked;
            });

            const text = document.createElement('span');
            text.className = 'task-text';
            text.textContent = task.text;

            item.appendChild(checkbox);
            item.appendChild(text);
            taskArea.appendChild(item);
          });
        }

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'add-task-input';
        input.placeholder = '+task';
        input.addEventListener('keypress', (e) => {
          if (e.key === 'Enter' && input.value.trim() !== '') {
            if (!tasks[dateKey]) tasks[dateKey] = [];
            tasks[dateKey].push({ text: input.value.trim(), completed: false });
            input.value = '';
            renderCalendar();
          }
        });

        taskArea.appendChild(input);
        dayCard.appendChild(header);
        dayCard.appendChild(taskArea);
        gridEl.appendChild(dayCard);
      });
    }

    prevBtn.addEventListener('click', () => {
      if (currentView === 'week') {
        currentDate.setDate(currentDate.getDate() - 7);
      } else {
        currentDate.setMonth(currentDate.getMonth() - 1);
      }
      renderCalendar();
    });

    nextBtn.addEventListener('click', () => {
      if (currentView === 'week') {
        currentDate.setDate(currentDate.getDate() + 7);
      } else {
        currentDate.setMonth(currentDate.getMonth() + 1);
      }
      renderCalendar();
    });

    weekViewBtn.addEventListener('click', () => {
      currentView = 'week';
      weekViewBtn.classList.add('active');
      monthViewBtn.classList.remove('active');
      renderCalendar();
    });

    monthViewBtn.addEventListener('click', () => {
      currentView = 'month';
      monthViewBtn.classList.add('active');
      weekViewBtn.classList.remove('active');
      renderCalendar();
    });

    renderCalendar();
  </script>
</body>
</html>
