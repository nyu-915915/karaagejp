<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Calendar</title>
  <!-- Google Fonts: Rozha One & Libre Bodoni -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Rozha+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #191919;
      --card-bg: #ffffff;
      --accent-blue: #8fa7cc;
      --gray-color: #868C91;
      --text-black: #000000;
      --text-white: #ffffff;
      --font-num: 'Rozha One', serif;
      --font-text: 'Libre Bodoni', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      padding: 20px;
      min-height: 100vh;
      font-family: var(--font-text);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ヘッダーエリア */
    .header {
      width: 100%;
      max-width: 1440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 矢印ボタン（白文字） */
    .nav-btn {
      background: none;
      border: 1px solid var(--gray-color);
      color: var(--text-white); /* 矢印は白 */
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    /* 8/30-9/5 等の範囲表示テキスト（白文字） */
    .date-range-text {
      color: var(--text-white); /* 文字色：白 */
      font-family: var(--font-num);
      font-size: 1.2rem;
      margin-left: 8px;
    }

    /* 切替ボタン（W / M） */
    .view-switch {
      display: flex;
      gap: 8px;
    }

    .switch-btn {
      background: none;
      border: 1px solid var(--gray-color);
      padding: 4px 12px;
      cursor: pointer;
      font-size: 1rem;
      color: var(--text-white);
      font-family: var(--font-text);
    }

    .switch-btn.active {
      background-color: var(--accent-blue);
      color: var(--text-white);
      border-color: var(--accent-blue);
    }

    /* カレンダーグリッド */
    .calendar-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 1470px;
    }

    /* 日付カード（枠組み幅200px） */
    .day-card {
      background-color: var(--card-bg);
      width: 200px; /* カード幅 200px */
      min-height: 220px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--gray-color);
    }

    /* 日付・曜日ヘッダー（青背景 #8fa7cc） */
    .day-header {
      background-color: var(--accent-blue);
      color: var(--text-white);
      padding: 8px 4px;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--gray-color);
    }

    .date-num {
      font-family: var(--font-num);
      font-size: 1.1rem;
    }

    .day-text {
      font-family: var(--font-text);
      font-size: 1rem;
    }

    /* タスクエリア */
    .task-area {
      padding: 10px 8px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-color: var(--card-bg);
    }

    /* タスク項目 */
    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      flex-grow: 1;
    }

    /* チェックボックス（グレー #868C91） */
    .task-checkbox {
      appearance: none;
      width: 15px;
      height: 15px;
      border: 1px solid var(--gray-color);
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      background-color: var(--card-bg);
    }

    .task-checkbox:checked {
      background-color: var(--gray-color);
    }

    .task-checkbox:checked::after {
      content: '✓';
      color: #ffffff;
      font-size: 11px;
      position: absolute;
      top: -3px;
      left: 1px;
    }

    /* タスク文字（黒） */
    .task-text {
      color: var(--text-black);
      font-family: var(--font-text);
      font-size: 0.9rem;
      word-break: break-all;
    }

    /* チェック後の打ち消し線 */
    .task-checkbox:checked + .task-text {
      text-decoration: line-through;
      color: var(--gray-color);
    }

    /* 削除ボタン（✕） */
    .delete-btn {
      background: none;
      border: none;
      color: var(--gray-color);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0 2px;
      line-height: 1;
    }

    .delete-btn:hover {
      color: #e53e3e;
    }

    /* タスク入力（＋task） */
    .add-task-input {
      width: 100%;
      border: none;
      border-bottom: 1px solid var(--gray-color);
      outline: none;
      font-size: 0.85rem;
      padding: 4px 0;
      margin-top: auto;
      background: transparent;
      color: var(--text-black);
      font-family: var(--font-text);
    }

    .add-task-input::placeholder {
      color: var(--gray-color);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="nav-controls">
      <button class="nav-btn" id="prev-btn">◀</button>
      <button class="nav-btn" id="next-btn">▶</button>
      <span class="date-range-text" id="date-range-text">8/30 - 9/5</span>
    </div>
    <div class="view-switch">
      <button class="switch-btn active" id="week-view-btn">W</button>
      <button class="switch-btn" id="month-view-btn">M</button>
    </div>
  </div>

  <div class="calendar-grid" id="calendar-grid"></div>

  <script>
    let currentDate = new Date();
    let currentView = 'week';

    // 英語の頭文字 (Sun->S, Mon->M...)
    const daysEn = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    const tasks = {};

    const gridEl = document.getElementById('calendar-grid');
    const dateRangeTextEl = document.getElementById('date-range-text');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const weekViewBtn = document.getElementById('week-view-btn');
    const monthViewBtn = document.getElementById('month-view-btn');

    function formatDateKey(date) {
      return `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate()}`;
    }

    function getWeekDates(date) {
      const start = new Date(date);
      const day = start.getDay();
      start.setDate(start.getDate() - day);

      const week = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(start);
        d.setDate(d.getDate() + i);
        week.push(d);
      }
      return week;
    }

    function getMonthDates(date) {
      const year = date.getFullYear();
      const month = date.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      const days = [];
      const startDayOfWeek = firstDay.getDay();

      for (let i = startDayOfWeek; i > 0; i--) {
        days.push(new Date(year, month, 1 - i));
      }
      for (let i = 1; i <= lastDay.getDate(); i++) {
        days.push(new Date(year, month, i));
      }
      return days;
    }

    function updateHeader(dates) {
      if (dates.length > 0) {
        const start = dates[0];
        const end = dates[dates.length - 1];
        dateRangeTextEl.textContent = `${start.getMonth() + 1}/${start.getDate()} - ${end.getMonth() + 1}/${end.getDate()}`;
      }
    }

    function renderCalendar() {
      gridEl.innerHTML = '';

      const dates = currentView === 'week' ? getWeekDates(currentDate) : getMonthDates(currentDate);
      updateHeader(dates);

      dates.forEach(date => {
        const dateKey = formatDateKey(date);
        
        // カレンダーカード要素
        const dayCard = document.createElement('div');
        dayCard.className = 'day-card';

        // ヘッダー（月/日 (曜日頭文字)）
        const header = document.createElement('div');
        header.className = 'day-header';
        header.innerHTML = `<span class="date-num">${date.getMonth() + 1}/${date.getDate()}</span><span class="day-text">(${daysEn[date.getDay()]})</span>`;

        // タスク表示エリア
        const taskArea = document.createElement('div');
        taskArea.className = 'task-area';

        // タスク描画処理
        if (tasks[dateKey]) {
          tasks[dateKey].forEach((task, index) => {
            const item = document.createElement('div');
            item.className = 'task-item';

            const leftBox = document.createElement('div');
            leftBox.className = 'task-left';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'task-checkbox';
            checkbox.checked = task.completed;
            checkbox.addEventListener('change', () => {
              task.completed = checkbox.checked;
            });

            const text = document.createElement('span');
            text.className = 'task-text';
            text.textContent = task.text;

            leftBox.appendChild(checkbox);
            leftBox.appendChild(text);

            // 削除ボタン (✕)
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = '✕';
            deleteBtn.addEventListener('click', () => {
              tasks[dateKey].splice(index, 1);
              renderCalendar();
            });

            item.appendChild(leftBox);
            item.appendChild(deleteBtn);
            taskArea.appendChild(item);
          });
        }

        // 入力フォーム (＋task)
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'add-task-input';
        input.placeholder = '＋task';
        
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.isComposing && input.value.trim() !== '') {
            if (!tasks[dateKey]) {
              tasks[dateKey] = [];
            }
            tasks[dateKey].push({
              text: input.value.trim(),
              completed: false
            });
            input.value = '';
            renderCalendar();
          }
        });

        taskArea.appendChild(input);
        dayCard.appendChild(header);
        dayCard.appendChild(taskArea);
        gridEl.appendChild(dayCard);
      });
    }

    // 矢印ボタンイベント
    prevBtn.addEventListener('click', () => {
      if (currentView === 'week') {
        currentDate.setDate(currentDate.getDate() - 7);
      } else {
        currentDate.setMonth(currentDate.getMonth() - 1);
      }
      renderCalendar();
    });

    nextBtn.addEventListener('click', () => {
      if (currentView === 'week') {
        currentDate.setDate(currentDate.getDate() + 7);
      } else {
        currentDate.setMonth(currentDate.getMonth() + 1);
      }
      renderCalendar();
    });

    // 切替ボタンイベント (W / M)
    weekViewBtn.addEventListener('click', () => {
      currentView = 'week';
      weekViewBtn.classList.add('active');
      monthViewBtn.classList.remove('active');
      renderCalendar();
    });

    monthViewBtn.addEventListener('click', () => {
      currentView = 'month';
      monthViewBtn.classList.add('active');
      weekViewBtn.classList.remove('active');
      renderCalendar();
    });

    renderCalendar();
  </script>
</body>
</html>
