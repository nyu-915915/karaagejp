<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Task Calendar</title>
  <!-- Google Fonts: Rozha One & Libre Bodoni -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:ital,wght@0,400..700;1,400..700&family=Rozha+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #191919;
      --card-bg: #ffffff;
      --accent-color: #8fa7cc;
      --gray-color: #868C91;
      --text-black: #000000;
      --text-white: #ffffff;
      --font-num: 'Rozha One', serif;
      --font-text: 'Libre Bodoni', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      padding: 16px;
      max-width: 900px;
      margin: 0 auto;
      font-family: var(--font-text);
    }

    /* ヘッダーエリア */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-btn {
      background-color: transparent;
      border: 1px solid var(--gray-color);
      color: var(--text-white);
      width: 28px;
      height: 28px;
      border-radius: 0; /* 直角 */
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }

    .month-badge {
      display: inline-block;
      background-color: var(--accent-color);
      color: var(--text-white);
      padding: 2px 12px;
      font-family: var(--font-text);
      font-size: 1.1rem;
      border-radius: 0; /* 直角 */
    }

    .year-text {
      font-family: var(--font-num);
      font-size: 1.2rem;
      color: var(--text-white);
      margin-left: 6px;
    }

    .view-switch {
      display: flex;
      gap: 6px;
    }

    .switch-btn {
      background: none;
      border: 1px solid var(--gray-color);
      padding: 4px 10px;
      border-radius: 0; /* 直角 */
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-white);
      font-family: var(--font-text);
    }

    .switch-btn.active {
      background-color: var(--accent-color);
      color: var(--text-white);
      border-color: var(--accent-color);
    }

    /* カレンダーグリッド */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    /* カレンダーカード（白背景・直角） */
    .day-card {
      background-color: var(--card-bg);
      border-radius: 0; /* 直角 */
      min-height: 160px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .day-header {
      padding: 6px 4px;
      text-align: center;
      border-bottom: 1px solid #f0f0f0;
      color: var(--text-black);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }

    .date-num {
      font-family: var(--font-num);
      font-size: 0.95rem;
    }

    .day-text {
      font-family: var(--font-text);
      font-size: 0.85rem;
    }

    /* 今日の強調バッジ（直角） */
    .day-card.is-today .day-header {
      background-color: var(--accent-color);
      color: var(--text-white);
    }

    .task-area {
      padding: 8px 6px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* タスク項目 */
    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      font-size: 0.85rem;
      font-family: var(--font-text);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }

    .task-checkbox {
      appearance: none;
      width: 14px;
      height: 14px;
      border: 1px solid var(--gray-color);
      border-radius: 0;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }

    .task-checkbox:checked {
      background-color: var(--gray-color);
    }

    .task-checkbox:checked::after {
      content: '✓';
      color: #ffffff;
      font-size: 10px;
      position: absolute;
      top: -3px;
      left: 1px;
    }

    .task-text {
      color: var(--text-black);
      word-break: break-all;
      font-family: var(--font-text);
    }

    .task-checkbox:checked + .task-text {
      text-decoration: line-through;
      color: var(--gray-color);
    }

    /* 削除（×）ボタン */
    .delete-btn {
      background: none;
      border: none;
      color: var(--gray-color);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0 2px;
      line-height: 1;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .delete-btn:hover {
      opacity: 1;
      color: #e53e3e;
    }

    /* タスク入力フォーム */
    .add-task-input {
      width: 100%;
      border: none;
      border-bottom: 1px dashed var(--gray-color);
      outline: none;
      font-size: 0.8rem;
      padding: 2px 0;
      margin-top: auto;
      background: transparent;
      color: var(--text-black);
      font-family: var(--font-text);
    }

    .add-task-input::placeholder {
      color: var(--gray-color);
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="nav-controls">
      <button class="nav-btn" id="prev-btn">◀</button>
      <button class="nav-btn" id="next-btn">▶</button>
      <div>
        <span class="month-badge" id="month-badge">October</span>
        <span class="year-text" id="year-text">2026</span>
      </div>
    </div>
    <div class="view-switch">
      <button class="switch-btn active" id="week-view-btn">W</button>
      <button class="switch-btn" id="month-view-btn">M</button>
    </div>
  </div>

  <div class="calendar-grid" id="calendar-grid"></div>

  <script>
    let currentDate = new Date();
    let currentView = 'week';
    
    const monthNamesEn = [
      "January", "February", "March", "April", "May", "June", 
      "July", "August", "September", "October", "November", "December"
    ];
    const daysEn = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

    const tasks = {};

    const gridEl = document.getElementById('calendar-grid');
    const monthBadgeEl = document.getElementById('month-badge');
    const yearTextEl = document.getElementById('year-text');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const weekViewBtn = document.getElementById('week-view-btn');
    const monthViewBtn = document.getElementById('month-view-btn');

    function formatDateKey(date) {
      return `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate()}`;
    }

    function isToday(date) {
      const today = new Date();
      return date.getDate() === today.getDate() &&
             date.getMonth() === today.getMonth() &&
             date.getFullYear() === today.getFullYear();
    }

    function updateHeader() {
      monthBadgeEl.textContent = monthNamesEn[currentDate.getMonth()];
      yearTextEl.textContent = currentDate.getFullYear();
    }

    function getWeekDates(date) {
      const start = new Date(date);
      const day = start.getDay();
      start.setDate(start.getDate() - day);

      const week = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(start);
        d.setDate(d.getDate() + i);
        week.push(d);
      }
      return week;
    }

    function getMonthDates(date) {
      const year = date.getFullYear();
      const month = date.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      const days = [];
      const startDayOfWeek = firstDay.getDay();

      for (let i = startDayOfWeek; i > 0; i--) {
        days.push(new Date(year, month, 1 - i));
      }
      for (let i = 1; i <= lastDay.getDate(); i++) {
        days.push(new Date(year, month, i));
      }
      return days;
    }

    function renderCalendar() {
      gridEl.innerHTML = '';

      const dates = currentView === 'week' ? getWeekDates(currentDate) : getMonthDates(currentDate);
      updateHeader();

      dates.forEach(date => {
        const dateKey = formatDateKey(date);
        const dayCard = document.createElement('div');
        dayCard.className = 'day-card';
        if (isToday(date)) {
          dayCard.classList.add('is-today');
        }

        const header = document.createElement('div');
        header.className = 'day-header';
        header.innerHTML = `<span class="date-num">${date.getMonth() + 1}/${date.getDate()}</span> <span class="day-text">(${daysEn[date.getDay()]})</span>`;

        const taskArea = document.createElement('div');
        taskArea.className = 'task-area';

        if (tasks[dateKey]) {
          tasks[dateKey].forEach((task, index) => {
            const item = document.createElement('div');
            item.className = 'task-item';

            const leftBox = document.createElement('div');
            leftBox.className = 'task-left';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'task-checkbox';
            checkbox.checked = task.completed;
            checkbox.addEventListener('change', () => {
              task.completed = checkbox.checked;
            });

            const text = document.createElement('span');
            text.className = 'task-text';
            text.textContent = task.text;

            leftBox.appendChild(checkbox);
            leftBox.appendChild(text);

            // 削除（×）ボタンの設定
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = '✕';
            deleteBtn.addEventListener('click', () => {
              tasks[dateKey].splice(index, 1); // 配列から要素を削除
              renderCalendar(); // 画面を再描画
            });

            item.appendChild(leftBox);
            item.appendChild(deleteBtn);
            taskArea.appendChild(item);
          });
        }

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'add-task-input';
        input.placeholder = '+ task';
        input.addEventListener('keypress', (e) => {
          if (e.key === 'Enter' && input.value.trim() !== '') {
            if (!tasks[dateKey]) tasks[dateKey] = [];
            tasks[dateKey].push({ text: input.value.trim(), completed: false });
            input.value = '';
            renderCalendar();
          }
        });

        taskArea.appendChild(input);
        dayCard.appendChild(header);
        dayCard.appendChild(taskArea);
        gridEl.appendChild(dayCard);
      });
    }

    prevBtn.addEventListener('click', () => {
      if (currentView === 'week') {
        currentDate.setDate(currentDate.getDate() - 7);
      } else {
        currentDate.setMonth(currentDate.getMonth() - 1);
      }
      renderCalendar();
    });

    nextBtn.addEventListener('click', () => {
      if (currentView === 'week') {
        currentDate.setDate(currentDate.getDate() + 7);
      } else {
        currentDate.setMonth(currentDate.getMonth() + 1);
      }
      renderCalendar();
    });

    weekViewBtn.addEventListener('click', () => {
      currentView = 'week';
      weekViewBtn.classList.add('active');
      monthViewBtn.classList.remove('active');
      renderCalendar();
    });

    monthViewBtn.addEventListener('click', () => {
      currentView = 'month';
      monthViewBtn.classList.add('active');
      weekViewBtn.classList.remove('active');
      renderCalendar();
    });

    renderCalendar();
  </script>
</body>
</html>
